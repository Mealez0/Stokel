name: AGION Lean Verification
on:
  push:
    branches: [agion-lean-verify]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Lean kernel check
        run: lean AGIONRestriction.lean
