name: AGION Lean Verification
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate finite certificate
        shell: bash
        run: |
          g++ -O3 -std=c++20 generate_lean_certificate.cpp -o generate_certificate
          ./generate_certificate > AGIONGeneratedCertificate.lean
          wc -c AGIONGeneratedCertificate.lean
      - name: Lean formal certificate check
        shell: bash
        run: |
          ulimit -s unlimited
          lean --version
          lean AGIONGeneratedCertificate.lean
